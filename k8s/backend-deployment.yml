apiVersion: apps/v1
kind: Deployment 
metadata:
  name: backend-deploymnet 
  namespace: chat-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      name: backend-pod
      namespace: chat-app
      labels:
        app: backend
    spec:
      containers:
      - name: backend-container
        image: crickplankton/chatapp-bakcend:latest
        ports:
        - containerPort: 5001
        env:
        - name: NODE_ENV
          value: production
        - name: MONGODB_URI
          value: mongodb://root:root@mongodb:27017/chatapp?authSource=admin
        - name: JWT_SECRET
          valueFrom: 
            secretKeyRef:
              name: chatapp-secrets
              key: jwt
        - name: PORT
          value: "5001"